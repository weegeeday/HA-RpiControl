reboot:
  name: Reboot Pi
  description: Reboot the Pi via the Pi Control service.

get_fullpageos:
  name: Get FullPageOS content
  description: Reads /boot/fullpageos.txt and stores it in state picontrol.fullpageos.

set_fullpageos:
  name: Set FullPageOS content
  description: Writes /boot/fullpageos.txt content.
  fields:
    content:
      name: Content
      description: Full file contents to write.
      required: true
      selector:
        text:
          multiline: true

run_ssh:
  name: Run SSH command
  description: Runs an SSH command on a remote host via the Pi service.
  fields:
    host:
      name: Host
      required: true
      selector:
        text:
    command:
      name: Command
      required: true
      selector:
        text:
    user:
      name: User
      required: false
      selector:
        text:
    port:
      name: Port
      required: false
      selector:
        number:
          min: 1
          max: 65535
    identity_file:
      name: Identity file
      required: false
      selector:
        text:
